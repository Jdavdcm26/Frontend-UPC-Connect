name: CI

# Se ejecuta en cada Pull Request y en cada push a develop o main.
on:
  pull_request:
  push:
    branches: [develop, main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Auditoria de seguridad (solo produccion)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Build (incluye la revisión de tipos)
        run: npm run build